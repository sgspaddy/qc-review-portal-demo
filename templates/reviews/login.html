<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>QC Review Portal — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --ink:#1b1b1b;
      --muted:#6b7280;
      --brand:#4c1d95;
      --bg:#fbfbfe;
    }
    body{ background:var(--bg); color:var(--ink); }
    .card{
      border-radius:16px;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 10px 25px rgba(0,0,0,.06);
    }
    .brand{ color:var(--brand); font-weight:700; letter-spacing:.2px; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-4">
  <div class="card p-4" style="max-width:420px; width:100%;">
    <div class="mb-3">
      <div class="brand fs-4">QC Review Portal</div>
      <div class="text-muted">Sign in to review specimen QC decisions.</div>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger py-2">Invalid username or password.</div>
    {% endif %}

    {% if next %}
      <div class="alert alert-info py-2">
        Please log in to continue.
      </div>
    {% endif %}

    <form method="post" class="vstack gap-3">
      {% csrf_token %}
      <div>
        <label class="form-label">Username</label>
        <input name="username" class="form-control" autocomplete="username" required>
      </div>
      <div>
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>

      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>

    <div class="text-muted small mt-3">
      Tip: Create a superuser with <code>python manage.py createsuperuser</code>.
    </div>
  </div>
</body>
</html>
